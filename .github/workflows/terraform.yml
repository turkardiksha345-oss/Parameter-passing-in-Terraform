name: Terraform Deploy (ENV Only)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Choose Environment "
        required: true
        type : choice
        options :
          - dev
          - test
          - prod
        default: "dev"

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: root-module

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 🔐 AWS Credentials (Access Key Method)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 🔹 Terraform Init
      - name: Terraform Init
        run: terraform init

      # 🔹 Terraform Plan (Only ENV)
      - name: Terraform Plan
        run: terraform plan -var="env=${{ github.event.inputs.env }}"

      # 🔹 Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="env=${{ github.event.inputs.env }}"
